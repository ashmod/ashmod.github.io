<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{TITLE}}</title>
        <meta name="description" content="{{DESCRIPTION}}" />
        <link rel="canonical" href="{{CANONICAL}}" />

        <meta property="og:type" content="website" />
        <meta property="og:title" content="{{TITLE}}" />
        <meta property="og:description" content="{{DESCRIPTION}}" />
        <meta property="og:url" content="{{CANONICAL}}" />
        <meta
            property="og:image"
            content="https://www.ashmod.dev/assets/images/banner.png"
        />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{TITLE}}" />
        <meta name="twitter:description" content="{{DESCRIPTION}}" />
        <meta
            name="twitter:image"
            content="https://www.ashmod.dev/assets/images/banner.png"
        />

        <link rel="stylesheet" href="{{ROOT}}/assets/css/style.css" />
        <link
            rel="icon"
            href="{{ROOT}}/assets/images/favicon.ico"
            sizes="any"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="{{ROOT}}/assets/images/favicon-32.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="{{ROOT}}/assets/images/apple-touch-icon.png"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        />
        <script src="{{ROOT}}/assets/js/themes.js"></script>
        <script>
            (function () {
                const saved = localStorage.getItem("theme");
                if (
                    saved &&
                    window.ThemeSystem &&
                    window.ThemeSystem.THEMES[saved]
                ) {
                    const theme = window.ThemeSystem.THEMES[saved];
                    const root = document.documentElement;
                    for (const [prop, val] of Object.entries(theme.colors)) {
                        root.style.setProperty(prop, val);
                    }
                }
            })();
        </script>
    </head>

    <body class="home-body">
        <div class="home-container">
            <div style="position: absolute; top: 1rem; right: 1rem">
                <button
                    id="theme-toggle"
                    class="theme-toggle"
                    aria-label="Choose Theme"
                >
                    <i class="fas fa-palette"></i>
                </button>
            </div>

            <header class="home-hero">
                <img
                    src="{{ROOT}}/assets/images/pfp.png"
                    alt="Profile picture"
                    class="profile-pic"
                />
                <p class="profile-tagline">techie • gamer • bookworm</p>
                <div class="social-icons">
                    <a
                        href="https://linkedin.com/in/ShehabMahmoud"
                        target="_blank"
                        aria-label="LinkedIn"
                        ><i class="fab fa-linkedin"></i
                    ></a>
                    <a
                        href="https://x.com/shehabtweets"
                        target="_blank"
                        aria-label="X"
                        ><i class="fab fa-x-twitter"></i
                    ></a>
                    <a
                        href="https://github.com/ashmod"
                        target="_blank"
                        aria-label="GitHub"
                        ><i class="fab fa-github"></i
                    ></a>
                    <a
                        href="https://monkeytype.com/profile/dizzydroid"
                        target="_blank"
                        aria-label="MonkeyType"
                        ><i class="fas fa-keyboard"></i
                    ></a>
                    <a
                        href="https://steamcommunity.com/id/dizzydroid"
                        target="_blank"
                        aria-label="Steam"
                        ><i class="fab fa-steam"></i
                    ></a>
                </div>
                <div class="internet-corner-banner">
                    <span class="corner-text-small">my little</span>
                    <h1 class="corner-text-large">
                        <span class="corner-word">internet</span>
                        <span class="corner-highlight">corner.</span>
                    </h1>
                </div>
            </header>

            <nav class="home-nav">
                <a href="{{ROOT}}/work" class="home-nav-btn">WORK</a>
                <a href="{{ROOT}}/blog" class="home-nav-btn">BLOG</a>
                <a href="{{ROOT}}/about" class="home-nav-btn">ABOUT</a>
                <a href="{{ROOT}}/contact" class="home-nav-btn">CONTACT</a>
            </nav>

            <footer class="home-footer">
                <p>&copy; 2026 Shehab Mahmoud</p>
            </footer>
        </div>
        <script>
            if (window.ThemeSystem) {
                window.ThemeSystem.initTheme();
            }

            document
                .getElementById("theme-toggle")
                .addEventListener("click", () => {
                    if (window.ThemeSystem) {
                        window.ThemeSystem.showThemePicker();
                    }
                });

            (function () {
                const reduceMotion = window.matchMedia(
                    "(prefers-reduced-motion: reduce)"
                ).matches;

                const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ!<>-_\\/[]{}=+*#?%";
                const scrambleChar = (ch) =>
                    ch === " "
                        ? " "
                        : glyphs[(Math.random() * glyphs.length) | 0];

                const body = document.querySelector(".home-body");
                if (
                    body &&
                    !reduceMotion &&
                    window.matchMedia("(pointer: fine)").matches
                ) {
                    let tx = window.innerWidth / 2;
                    let ty = window.innerHeight * 0.4;
                    let cx = tx;
                    let cy = ty;
                    let raf = null;
                    const render = () => {
                        cx += (tx - cx) * 0.18;
                        cy += (ty - cy) * 0.18;
                        body.style.setProperty("--mx", cx + "px");
                        body.style.setProperty("--my", cy + "px");
                        if (Math.abs(tx - cx) > 0.5 || Math.abs(ty - cy) > 0.5) {
                            raf = requestAnimationFrame(render);
                        } else {
                            raf = null;
                        }
                    };
                    window.addEventListener("pointermove", (e) => {
                        tx = e.clientX;
                        ty = e.clientY;
                        body.classList.add("cursor-active");
                        if (!raf) raf = requestAnimationFrame(render);
                    });
                    const deactivate = () =>
                        body.classList.remove("cursor-active");
                    document.documentElement.addEventListener(
                        "pointerleave",
                        deactivate
                    );
                    window.addEventListener("blur", deactivate);
                }

                let scrambleRaf = null;
                function scramble(targets, duration) {
                    cancelAnimationFrame(scrambleRaf);
                    const start = performance.now();
                    const total = targets.reduce((n, t) => n + t.text.length, 0);
                    function frame(now) {
                        const p = Math.min((now - start) / duration, 1);
                        const revealed = p * total;
                        let idx = 0;
                        for (const t of targets) {
                            let out = "";
                            for (let i = 0; i < t.text.length; i++) {
                                const ch = t.text[i];
                                out +=
                                    idx + i < revealed ? ch : scrambleChar(ch);
                            }
                            t.el.textContent = out;
                            idx += t.text.length;
                        }
                        if (p < 1) {
                            scrambleRaf = requestAnimationFrame(frame);
                        } else {
                            scrambleRaf = null;
                            targets.forEach((t) => (t.el.textContent = t.text));
                        }
                    }
                    scrambleRaf = requestAnimationFrame(frame);
                }

                const banner = document.querySelector(
                    ".internet-corner-banner"
                );
                const word = document.querySelector(".corner-word");
                const highlight = document.querySelector(".corner-highlight");
                if (word && highlight && !reduceMotion) {
                    const targets = [
                        { el: word, text: word.textContent.trim() },
                        { el: highlight, text: highlight.textContent.trim() },
                    ];
                    targets.forEach(
                        (t) =>
                            (t.el.textContent = t.text
                                .split("")
                                .map(scrambleChar)
                                .join(""))
                    );
                    setTimeout(() => scramble(targets, 1000), 450);
                    if (banner) {
                        banner.style.cursor = "pointer";
                        banner.addEventListener("click", () =>
                            scramble(targets, 850)
                        );
                    }
                }
            })();
        </script>
    </body>
</html>
